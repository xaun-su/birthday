<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粒子爱心动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const totalParticles = 2000;
        let messageOpacity = 0;  // 控制文本的透明度
        let messageAlpha = 1;    // 控制透明度衰减
        let showMessage = false; // 控制是否显示文字

        function heartShape(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            return { x: x * 15, y: -y * 15 };
        }

        class Particle {
            constructor(x, y) {
                this.initialX = Math.random() * canvas.width;
                this.initialY = Math.random() * canvas.height;
                this.targetX = x + canvas.width / 2;
                this.targetY = y + canvas.height / 2;
                this.x = this.initialX;
                this.y = this.initialY;
                this.size = Math.random() * 1.5 + 0.5;
                this.opacity = Math.random();
                this.speed = Math.random() * 0.02 + 0.005;
                this.backgroundParticle = Math.random() < 0.2;
            }

            update() {
                if (!this.backgroundParticle) {
                    this.x += (this.targetX - this.x) * this.speed;
                    this.y += (this.targetY - this.y) * this.speed;
                } else {
                    this.x += Math.random() * 2 - 1;
                    this.y += Math.random() * 2 - 1;
                    if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                        this.x = Math.random() * canvas.width;
                        this.y = Math.random() * canvas.height;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.backgroundParticle ? 'rgba(255, 182, 193, 0.2)' : 'pink';
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }
        }

        function initParticles() {
            for (let i = 0; i < totalParticles; i++) {
                const t = Math.random() * Math.PI * 2;
                const pos = heartShape(t);
                particles.push(new Particle(pos.x, pos.y));
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            // 在5秒后开始显示文本
            if (showMessage) {
                messageOpacity += 0.01;
                if (messageOpacity > 1) messageOpacity = 1;
                ctx.globalAlpha = messageAlpha;
                ctx.fillStyle = 'white';
                ctx.font = '50px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText("我爱你宝宝 生日快乐", canvas.width / 2, canvas.height / 2);

                messageAlpha -= 0.01;  // 逐渐让文本淡出
                if (messageAlpha <= 0) {
                    return;  // 停止绘制
                }
            }

            requestAnimationFrame(animate);
        }

        // 设置延迟5秒后开始显示文字
        setTimeout(() => {
            showMessage = true;
        }, 7000);  // 5秒后开始显示文本

        initParticles();
        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles.length = 0;
            initParticles();
        });
           // 设置延迟5秒后开始显示文字
           setTimeout(() => {
            location.href='./love.html'
        }, 9000);  // 5秒后开始显示文本
    </script>
</body>
</html>
