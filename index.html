<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快乐！</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fce4ec; /* 淡粉色背景 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        h1 {
            color: #e91e63; /* 亮粉色标题 */
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        p {
            color: #777;
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .birthday-button {
            background-color: #ff4081; /* 按钮背景色 */
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1.2em;
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s ease;
        }

        .birthday-button:hover {
            background-color: #f50057; /* 悬停时颜色加深 */
        }

        /* 添加一些小装饰 */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #f06292;
            animation: confettiFall 3s linear infinite;
        }

        .confetti:nth-child(even) {
            background-color: #ba68c8;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <h1>生日快乐！</h1>
    <p>祝宝宝每天充满快乐和惊喜！</p>

    <button class="birthday-button" onclick="goToBirthdayPage()">查看专属祝福</button>

    <script>
        function goToBirthdayPage() {
            window.location.href = './index12.html'; // 替换为你的链接
        }

        // 添加一些彩带
        for (let i = 0; i < 50; i++) {
            let confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.animationDelay = Math.random() * 3 + 's';
            document.body.appendChild(confetti);
        }
    </script>

</body>
</html>
